    <script>
      (() => {
        let theme, palette;
        try { theme = localStorage.getItem('focus-reader.theme.v1'); palette = localStorage.getItem('focus-reader.palette.v1'); } catch {}
        const explicit = theme === 'light' || theme === 'dark';
        document.documentElement.dataset.theme = explicit ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.themeExplicit = String(explicit);
        document.documentElement.dataset.palette = ['standard', 'red-green', 'blue-yellow', 'high-contrast'].includes(palette) ? palette : 'standard';
      })();
    </script>
